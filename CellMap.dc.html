<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<div style="position:relative;width:100%;max-width:640px;margin:0 auto">
  <svg viewBox="0 0 400 320" role="img" aria-label="Ilustração de uma célula animal eucariótica com núcleo, retículos, complexo golgiense, lisossomos, mitocôndrias, ribossomos e vesículas" style="display:block;width:100%;height:auto;overflow:visible">
    <g style="opacity: {{ op.membrana }};transition:opacity .3s">
      <path d="M200 12 C 300 10, 388 70, 388 160 S 310 308, 200 308 S 12 250, 12 160 S 100 14, 200 12Z" style="fill:color-mix(in oklch, var(--accent) 6%, transparent);stroke:var(--accent);stroke-width:7"></path>
      <path d="M200 12 C 300 10, 388 70, 388 160 S 310 308, 200 308 S 12 250, 12 160 S 100 14, 200 12Z" style="fill:none;stroke:var(--bg);stroke-width:2.2"></path>
    </g>
    <g style="opacity: {{ op.nucleo }};transition:opacity .3s"><use href="#s-nucleo" x="55" y="95" width="115" height="115"></use></g>
    <g style="opacity: {{ op.rer }};transition:opacity .3s"><use href="#s-rer" x="172" y="64" width="104" height="64"></use></g>
    <g style="opacity: {{ op.rel }};transition:opacity .3s"><use href="#s-rel" x="178" y="196" width="96" height="59"></use></g>
    <g style="opacity: {{ op.golgi }};transition:opacity .3s"><use href="#s-golgi" x="286" y="116" width="80" height="65"></use></g>
    <g style="opacity: {{ op.liso }};transition:opacity .3s">
      <use href="#s-liso" x="118" y="236" width="30" height="30"></use>
      <use href="#s-liso" x="326" y="214" width="26" height="26"></use>
    </g>
    <g style="opacity: {{ op.mito }};transition:opacity .3s">
      <use href="#s-mito" x="40" y="224" width="64" height="31"></use>
      <use href="#s-mito" x="228" y="262" width="56" height="27"></use>
      <use href="#s-mito" x="100" y="38" width="56" height="27"></use>
    </g>
    <g style="opacity: {{ op.ribo }};transition:opacity .3s">
      <use href="#s-ribo" x="296" y="68" width="11" height="11"></use>
      <use href="#s-ribo" x="311" y="82" width="11" height="11"></use>
      <use href="#s-ribo" x="292" y="88" width="10" height="10"></use>
      <use href="#s-ribo" x="60" y="74" width="11" height="11"></use>
      <use href="#s-ribo" x="78" y="64" width="10" height="10"></use>
      <use href="#s-ribo" x="186" y="150" width="10" height="10"></use>
      <use href="#s-ribo" x="202" y="164" width="11" height="11"></use>
    </g>
    <g style="opacity: {{ op.vesic }};transition:opacity .3s">
      <use href="#s-vesic" x="276" y="96" width="16" height="16"></use>
      <use href="#s-vesic" x="364" y="188" width="16" height="16"></use>
      <use href="#s-vesic" x="340" y="92" width="13" height="13"></use>
    </g>
    <sc-if value="{{ showFlow }}" hint-placeholder-val="{{ false }}">
      <g style="fill:none;stroke:var(--ink);stroke-width:1.6;stroke-dasharray:4 3">
        <path d="M268 110 Q 284 118 292 134" style="marker-end:url(#arr)"></path>
        <path d="M356 176 Q 368 184 372 196" style="marker-end:url(#arr)"></path>
        <path d="M322 182 Q 330 196 334 210" style="marker-end:url(#arr)"></path>
      </g>
    </sc-if>
    <sc-if value="{{ showLabels }}" hint-placeholder-val="{{ false }}">
      <g style="font:600 12px var(--fh);letter-spacing:.02em;fill:var(--ink);paint-order:stroke;stroke:var(--bg);stroke-width:4px;stroke-linejoin:round">
        <text x="112" y="200" text-anchor="middle">Núcleo</text>
        <text x="224" y="58" text-anchor="middle">RER</text>
        <text x="174" y="232" text-anchor="end">REL</text>
        <text x="326" y="198" text-anchor="middle">Golgi</text>
        <text x="133" y="282" text-anchor="middle">Lisossomo</text>
        <text x="72" y="270" text-anchor="middle">Mitocôndria</text>
        <text x="306" y="60" text-anchor="middle">Ribossomos</text>
        <text x="372" y="182" text-anchor="middle">Vesícula</text>
        <text x="200" y="298" text-anchor="middle">Membrana plasmática</text>
        <text x="318" y="262" text-anchor="middle">Citoplasma</text>
      </g>
    </sc-if>
  </svg>
  <sc-for list="{{ hotspots }}" as="h" hint-placeholder-count="0">
    <button type="button" aria-label="{{ h.label }}" onClick="{{ h.pick }}" style="position:absolute;left:{{ h.left }};top:{{ h.top }};width:{{ h.width }};height:{{ h.height }};min-width:28px;min-height:28px;background:transparent;border:0;outline:{{ h.outline }};outline-offset:2px;cursor:pointer;padding:0"></button>
  </sc-for>
  <sc-for list="{{ markers }}" as="m" hint-placeholder-count="0">
    <button type="button" aria-label="{{ m.aria }}" onClick="{{ m.onClick }}" style="position:absolute;left:{{ m.left }};top:{{ m.top }};width:44px;height:44px;margin:-22px 0 0 -22px;background:transparent;border:0;padding:0;cursor:pointer;display:grid;place-items:center">
      <span style="min-width:30px;height:30px;padding:0 6px;display:grid;place-items:center;border-radius:15px;border:2px solid {{ m.ring }};background:{{ m.bg }};color:{{ m.fg }};font:600 14px/1 var(--fh);white-space:nowrap;box-shadow:0 1px 3px rgba(0,0,0,.2)">{{ m.text }}</span>
    </button>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:640,&quot;height&quot;:520},&quot;highlight&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;labels&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;flow&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;},&quot;onPick&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;(id:string)=&gt;void&quot;},&quot;markers&quot;:{&quot;editor&quot;:null,&quot;tsType&quot;:&quot;any[]&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const p = this.props, h = p.highlight;
    const ids = ['membrana','nucleo','rer','rel','golgi','liso','mito','ribo','vesic'];
    const op = {};
    ids.forEach(i => { op[i] = !h || h === i ? 1 : 0.2; });
    if (h === 'ribo') op.rer = 0.55;
    const HS = [
      ['membrana',150,0,100,26,'Membrana plasmática'],['membrana',376,120,24,70,'Membrana plasmática'],
      ['nucleo',60,100,105,105,'Núcleo'],['rer',172,64,104,64,'Retículo endoplasmático rugoso'],
      ['rel',178,196,96,59,'Retículo endoplasmático liso'],['golgi',286,116,80,65,'Complexo golgiense'],
      ['liso',116,234,34,34,'Lisossomo'],['liso',324,212,30,30,'Lisossomo'],
      ['mito',40,224,64,31,'Mitocôndria'],['mito',100,38,56,27,'Mitocôndria'],['mito',228,262,56,27,'Mitocôndria'],
      ['ribo',288,64,36,36,'Ribossomos'],['ribo',56,60,34,28,'Ribossomos'],
      ['vesic',272,92,24,24,'Vesícula'],['vesic',360,184,24,24,'Vesícula']
    ];
    const hotspots = p.onPick ? HS.map(([id,x,y,w,hh,label]) => ({
      label, left: x/4+'%', top: y/3.2+'%', width: w/4+'%', height: hh/3.2+'%',
      pick: () => p.onPick(id), outline: h === id ? '2px dashed var(--accent)' : 'none'
    })) : [];
    const markers = (p.markers || []).map(m => ({ ...m, left: m.x/4+'%', top: m.y/3.2+'%' }));
    return { op, hotspots, markers, showLabels: !!p.labels, showFlow: !!p.flow };
  }
}
</script>
</body>
</html>
